name: evalroute
repo: https://github.com/keppy/hermes-plugin-evalroute
sha: 1a05b9fda541e86f84eb01e0a45247b86d19eced
description: "Route a task to the right (model, reasoning effort) arm before you start. Classifies the task into a lane, prints a provenance-carrying route card, and installs per-model reasoning-effort defaults. Strong rules run locally; weak-signal classification calls the host LLM and consumes tokens. The separate harness and shim can make paid provider calls when explicitly run; no plugin-owned credentials. Disclosure — weak-signal task classification sends the task text to your active Zeus model via the host LLM facade (token cost). The model-callable tool, /route, /rate and observed /model and /reasoning commands append task text and command args to a local ledger at <ZEUS_HOME>/evalroute/labels.jsonl. \"zeus evalroute install-routes\" rewrites agent.reasoning_overrides in config.yaml when you run it. The bundled harness and Zeus shim are never run by the plugin. When run by hand they make paid provider calls, execute model-generated code on the host via shell checkers, and run zeus -z with approvals bypassed. Disclosure — \"zeus evalroute sync\" (run by hand) downloads the route table from the Hugging Face dataset keppy/evalroute-flywheel into ZEUS_HOME and route cards then show that dataset's text; \"zeus evalroute dispatch\" (run by hand) spawns a single-query zeus chat on the routed model (Nous provider by default) — or, with --runner claude-code, a `claude -p` (Claude Code) process under the user's own Claude account, whose per-run cost is recorded in the local sidecar — with the brief as its query, inheriting the current environment except ZEUS_YOLO_MODE (the worker never inherits --yolo; its approvals follow approvals.single_query_mode, default deny), and writes its report and a .dispatch.json sidecar beside the brief. Disclosure — \"zeus evalroute contribute\" (run by hand only) refuses to run unless evalroute.contribute: true is set in config.yaml, and then uploads redacted outcome rows only — lane, routed arm, confirmed arm, verdict, method, facet counts, ISO week and an HMAC-SHA256 task hash; never task text, notes, paths or the salt — to the user's own path (contributed/<hf-username>/) in the Hugging Face dataset keppy/evalroute-flywheel using the user's existing huggingface_hub login; \"--dry-run\" prints the exact rows and sends nothing; the per-install salt stays local in <ZEUS_HOME>/evalroute/contribute.salt. Since evalroute 0.9.1 (schema 2) the same upload also carries lane-correction rows as lane pairs (from_lane, to_lane, method, week) with no task text, plus the max_turns value and harness name the arm ran under and, since evalroute 0.10.0, whether the arm was an explore draw and which default arm it replaced (arm ids only). Disclosure — since evalroute 0.10.0, setting evalroute.explore.fraction in config.yaml (or EVALROUTE_EXPLORE) makes that fraction of routes recommend the lane's runner-up arm from the bundled explore table instead of the default arm (and \"zeus evalroute dispatch\" then runs that runner-up model), marked on the route card; off by default. Disclosure — \"zeus evalroute install-encoder <dir|owner/name>\" (run by hand only) downloads a small text-classification model (the default id keppy/evalroute-lane-encoder is a 146 MB ModernBERT fine-tune on the Hugging Face Hub) into <ZEUS_HOME>/evalroute/encoder/ and from then on \"zeus evalroute route\" runs it locally, offline, to classify the task when the keyword rules are weak, instead of the LLM call; it needs torch and transformers in the plugin environment (pip extra evalroute[encoder]), which the plugin does not install; \"install-encoder --remove\" deletes it. \"zeus evalroute export-cases\" (run by hand only) writes your --lane-pinned route rows, task text included, to a local file you name, for training your own encoder; stdout carries counts only and nothing is uploaded. Disclosure — since evalroute 0.11.0 the route card and the local ledger row record the harness the caller names (--harness or EVALROUTE_HARNESS), and evalroute.explore.arms in config.yaml lets you declare your own runner-up arm per harness and lane. \"zeus evalroute record\" appends outcome rows, with any unit id and trace path you pass, to the local ledger; \"zeus evalroute compare\" reads only the local ledger; \"zeus evalroute diagnose\" (run by hand only) reads the trace files your ledger rows point at and writes excerpts of them, which may contain your conversation text, to a local directory you name, and calls no model and fetches nothing. contribute never uploads unit ids, trace paths, or rows on your own local: lanes. As of 0.6.2 the plugin is a thin adapter: all behaviour lives in the PyPI package evalroute with its hub and decide extras (evalroute[hub,decide]>=0.11.0,<0.12, which add huggingface_hub for sync, contribute and install-encoder, and gonogo-eval for compare), declared as a Python dependency that Zeus installs on your confirmation."
maintainer: keppy
tier: community
category: tools
requires_zeus: '>=0.21'
version: "0.7.0"
docs_url: https://github.com/keppy/hermes-plugin-evalroute#readme
capabilities:
  provides_tools:
  - evalroute_route
  provides_hooks:
  - pre_llm_call
  - pre_command
  - post_llm_call
  provides_middleware: []
  requires_env: []
