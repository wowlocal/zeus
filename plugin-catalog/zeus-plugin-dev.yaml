description: "Zeus Plugin Dev: build Zeus plugins with Zeus. A plugin-development skill plus two offline tools that scaffold a new plugin and lint it against the catalog rules before you submit. The zeus-plugin-dev:zeus-plugin-development skill covers manifest v2 and strict YAML, the ctx API, all 46 hooks, capabilities and isolation, dashboard and Desktop panes, testing, release and catalog submission, and lessons from catalog reviews, with a template plugin and catalog-entry and PR-body templates. hpd_scaffold(target_dir, name) copies the hello-zeus template, which passes zeus plugins validate and doctor --ci as-is, renames it, and adds a catalog entry and PR body stub; it refuses non-empty folders and never overwrites. hpd_check(path, catalog_entry?) is a read-only lint: strict YAML, manifest rules, provides_tools against the registered tools, a security preflight, static schema token cost, and catalog entry rules (sha, image hosts, category, subdir, at most 6 screenshots). Both tool schemas together cost 190 o200k tokens. It is for anyone writing a first Zeus plugin or getting one ready for a catalog PR. To start, run zeus plugins install zeus-plugin-dev and zeus plugins enable zeus-plugin-dev, then ask: \"Scaffold a Zeus plugin called weather-now in ~/code/weather-now, then check it.\" Finish with zeus plugins doctor <dir> --ci and zeus plugins validate <dir> --install-deps. The same skill installs into other coding agents with npx skills add mojomast/zeus-plugin-dev. Disclosure — `hpd_scaffold` creates files in any new or empty folder the model names (fixed template content only); `hpd_check` reads any folder or file the model names (read-only, never imports it); the user-run `zeus hpd check <dir> --execute` imports and runs the target plugin's `register()` unsandboxed in the Zeus process, so use it only on code you trust."
