description: "Observe-with-approval Telegram Business Mode (secretary bot): Zeus drafts replies to your customers' messages and DMs each draft to you with Send, Edit and Discard buttons; nothing reaches a customer until you tap Send. A Zeus Labs plugin: built by Nous Research, not supported. Disclosure — each customer message is sent to your active Zeus model to draft the reply, and drafts and connection records are stored locally in <ZEUS_HOME>/telegram-business/state.db."
